name: Build ZuPather CI

on:
  push:
    branches: [ "main", "master", "windows", "macos" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows - ${{ matrix.name }}
    if: github.ref_name != 'macos'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "MSVC (x64)"
            toolchain: "msvc"
          - name: "MinGW-w64 (x64)"
            toolchain: "mingw"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW)
        if: matrix.toolchain == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-libwebp
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-binutils

      - name: Install vcpkg dependencies (MSVC)
        if: matrix.toolchain == 'msvc'
        run: |
          vcpkg install libwebp:x64-windows zstd:x64-windows

      - name: Configure CMake (MSVC)
        if: matrix.toolchain == 'msvc'
        run: |
          cmake -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build (MSVC)
        if: matrix.toolchain == 'msvc'
        run: |
          cmake --build build --config Release

      - name: Build (MinGW via MSYS2)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: |
          cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Upload Binary Artifact (MSVC)
        if: matrix.toolchain == 'msvc'
        uses: actions/upload-artifact@v4
        with:
          name: ZuPather-MSVC-x64
          path: build/Release/ZuPather.exe

      - name: Upload Binary Artifact (MinGW)
        if: matrix.toolchain == 'mingw'
        uses: actions/upload-artifact@v4
        with:
          name: ZuPather-MinGW-x64
          path: build/ZuPather.exe

  build-macos:
    name: macOS (Apple Silicon / Intel)
    if: github.ref_name != 'windows'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install webp zstd

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build macOS App Bundle
        run: |
          cmake --build build --config Release

      - name: Package macOS App Bundle
        run: |
          cd build
          zip -r ZuPather-macOS.zip ZuPather.app

      - name: Upload macOS App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZuPather-macOS-Bundle
          path: build/ZuPather-macOS.zip

  publish-release:
    name: Publish Release Packages
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact (MinGW)
        uses: actions/download-artifact@v4
        with:
          name: ZuPather-MinGW-x64
          path: artifact-windows

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ZuPather-macOS-Bundle
          path: artifact-macos

      - name: Prepare Release Archives
        run: |
          mkdir -p dist
          # Package Windows zip
          cp artifact-windows/ZuPather.exe dist/
          cp README.md CHANGELOG.md dist/
          cd dist
          zip -r "ZuPather-${{ github.ref_name }}-windows.zip" ZuPather.exe README.md CHANGELOG.md
          rm ZuPather.exe README.md CHANGELOG.md
          cd ..
          # Package macOS zip
          cp artifact-macos/ZuPather-macOS.zip "dist/ZuPather-${{ github.ref_name }}-macos.zip"

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ZuPather-*-windows.zip
            dist/ZuPather-*-macos.zip
          generate_release_notes: false
